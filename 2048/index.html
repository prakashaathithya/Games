<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #12151c;
    --panel: #1b212a;
    --panel-2: #242c37;
    --line: rgba(255,255,255,0.09);
    --ink: #e9ecf2;
    --muted: #8b95a3;
    --accent: #e8b45c;
    --board: #232a34;
    --slot: #2b3440;
    --gap: 10px;
  }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }

  /* ------------------------------------------------------------ head ---- */
  #head {
    width: min(94vw, 460px);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  #head h1 {
    margin: 0; font-size: clamp(28px, 8vw, 40px); font-weight: 800;
    letter-spacing: -0.02em; color: var(--accent);
  }
  .scores { display: flex; gap: 8px; }
  .score {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 7px 14px; text-align: center;
    min-width: 84px;
  }
  .score .label {
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .score .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score .gain {
    position: absolute; margin-left: 6px;
    color: var(--accent); font-weight: 700; font-size: 14px;
    animation: floatUp .6s ease-out forwards; pointer-events: none;
  }
  @keyframes floatUp {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-22px); }
  }

  /* ----------------------------------------------------------- board ---- */
  #wrap { position: relative; width: min(94vw, 62vh, 460px); }
  #board {
    position: relative;
    width: 100%; aspect-ratio: 1;
    background: var(--board);
    border-radius: 12px;
    padding: var(--gap);
    touch-action: none;
  }

  .slot, .tile {
    position: absolute;
    width: calc((100% - (var(--n) - 1) * var(--gap) - var(--gap) * 2) / var(--n));
    aspect-ratio: 1;
    border-radius: 8px;
    display: grid; place-items: center;
  }
  .slot { background: var(--slot); }
  .tile {
    font-weight: 800; letter-spacing: -0.03em;
    color: #17202a; background: #d9c9b0;
    transition: transform .1s ease-in-out;
    will-change: transform;
  }
  .slot, .tile {
    left: var(--gap); top: var(--gap);
    transform: translate(calc((100% + var(--gap)) * var(--c)),
                         calc((100% + var(--gap)) * var(--r)));
  }

  .tile.spawn { animation: pop .16s ease-out; }
  .tile.merged { animation: bump .16s ease-out; }
  @keyframes pop {
    from { transform: translate(calc((100% + var(--gap)) * var(--c)),
                                calc((100% + var(--gap)) * var(--r))) scale(0.3); }
  }
  @keyframes bump {
    50% { transform: translate(calc((100% + var(--gap)) * var(--c)),
                               calc((100% + var(--gap)) * var(--r))) scale(1.14); }
  }

  /* Value colours climb from sand to ember. */
  .v2    { background: #ded3c0; }
  .v4    { background: #ddcaa2; }
  .v8    { background: #eda86a; color: #1a1208; }
  .v16   { background: #ef8f57; color: #1a1208; }
  .v32   { background: #ee7351; color: #fff4ea; }
  .v64   { background: #e8543a; color: #fff4ea; }
  .v128  { background: #e0c05a; color: #221a05; }
  .v256  { background: #ddb63d; color: #221a05; }
  .v512  { background: #d9a521; color: #221a05; }
  .v1024 { background: #c98d12; color: #fffaf0; }
  .v2048 { background: #e8b45c; color: #1a1208; box-shadow: 0 0 24px rgba(232,180,92,0.5); }
  .vbig  { background: #3f7fb5; color: #f2f8ff; box-shadow: 0 0 22px rgba(63,127,181,0.5); }

  #over {
    position: absolute; inset: 0; z-index: 5;
    display: grid; place-items: center; text-align: center;
    background: rgba(18, 21, 28, 0.82);
    border-radius: 12px; backdrop-filter: blur(3px);
    padding: 20px;
  }
  #over[hidden] { display: none; }
  #over h2 { margin: 0 0 6px; font-size: clamp(22px, 6vw, 32px); }
  #over p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  #over .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* ---------------------------------------------------------- panel ---- */
  #tools {
    width: min(94vw, 460px);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  button {
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 11px 14px; min-height: 46px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2e3846; }
  button.primary { background: var(--accent); color: #1a1208; border-color: transparent; }
  button:disabled { opacity: 0.4; cursor: default; }

  #panel {
    width: min(94vw, 460px);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  #panel h2 {
    margin: 0 0 9px; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); font-weight: 650;
  }
  #setup { display: flex; gap: 10px; flex-wrap: wrap; }
  #setup label {
    flex: 1 1 110px; display: flex; flex-direction: column; gap: 6px;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }
  select {
    font: inherit; font-size: 14px; width: 100%;
    color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px; min-height: 42px;
  }
  #hint {
    margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.5;
  }
</style>
</head>
<body>

<div id="head">
  <h1>2048</h1>
  <div class="scores">
    <div class="score"><div class="label">Score</div><div class="value" id="scoreOut">0</div></div>
    <div class="score"><div class="label">Best</div><div class="value" id="bestOut">0</div></div>
  </div>
</div>

<div id="wrap">
  <div id="board"></div>
  <div id="over" hidden>
    <div>
      <h2 id="overTitle">No moves left</h2>
      <p id="overText">Nothing can slide or merge.</p>
      <div class="row">
        <button id="overMain" class="primary" type="button">New game</button>
        <button id="overUndo" type="button">Undo last move</button>
      </div>
    </div>
  </div>
</div>

<div id="tools">
  <button id="undoBtn" type="button">Undo</button>
  <button id="newBtn" type="button">New game</button>
  <button id="soundBtn" type="button">Sound on</button>
</div>

<div id="panel">
  <h2>Board</h2>
  <div id="setup">
    <label>Size
      <select id="sizeSel">
        <option value="3">3 × 3</option>
        <option value="4" selected>4 × 4</option>
        <option value="5">5 × 5</option>
        <option value="6">6 × 6</option>
      </select>
    </label>
    <label>Target
      <select id="targetSel">
        <option value="1024">1024</option>
        <option value="2048" selected>2048</option>
        <option value="4096">4096</option>
      </select>
    </label>
  </div>
  <div id="hint">Swipe, or use the arrow keys or WASD. Every move adds a tile; matching tiles merge into one. Best score is kept per board size.</div>
</div>

<script type="module">
// ---------------------------------------------------------------- state
const SAVE_KEY = '2048.save.v1';
const BEST_KEY = '2048.best.v1';

const state = {
  n: 4,
  target: 2048,
  tiles: [],          // { id, r, c, v, dead }
  score: 0,
  best: 0,
  won: false,
  over: false,
  sound: true,
  history: [],        // snapshots for undo
  busy: false,
  nextId: 1,
};

const VECTORS = {
  up:    [-1, 0],
  down:  [1, 0],
  left:  [0, -1],
  right: [0, 1],
};

const gridOf = () => {
  const grid = Array.from({ length: state.n }, () => new Array(state.n).fill(null));
  for (const t of state.tiles) if (!t.dead) grid[t.r][t.c] = t;
  return grid;
};

const emptyCells = () => {
  const grid = gridOf();
  const out = [];
  for (let r = 0; r < state.n; r++) for (let c = 0; c < state.n; c++) if (!grid[r][c]) out.push([r, c]);
  return out;
};

// ---------------------------------------------------------------- setup
function newGame() {
  state.n = parseInt(sizeSel.value, 10);
  state.target = parseInt(targetSel.value, 10);
  state.tiles = [];
  state.score = 0;
  state.won = false;
  state.over = false;
  state.history = [];
  state.nextId = 1;
  state.best = loadBest()[bestKey()] || 0;

  buildBoard();
  addTile();
  addTile();
  render(true);
  save();
}

function bestKey() { return state.n + 'x' + state.n; }

function addTile() {
  const cells = emptyCells();
  if (!cells.length) return null;
  const [r, c] = cells[Math.floor(Math.random() * cells.length)];
  const tile = { id: state.nextId++, r, c, v: Math.random() < 0.9 ? 2 : 4, fresh: true };
  state.tiles.push(tile);
  return tile;
}

// ---------------------------------------------------------------- moving
function move(dir) {
  if (state.busy || state.over) return;

  const [dr, dc] = VECTORS[dir];
  const before = snapshot();
  const grid = gridOf();

  // Work from the leading edge inwards so a tile never jumps past one that has
  // not moved yet.
  const rows = [...Array(state.n).keys()];
  const cols = [...Array(state.n).keys()];
  if (dr > 0) rows.reverse();
  if (dc > 0) cols.reverse();

  let moved = false, gained = 0;
  for (const t of state.tiles) { t.dead = false; t.mergedNow = false; t.fresh = false; }

  for (const r of rows) {
    for (const c of cols) {
      const tile = grid[r][c];
      if (!tile) continue;

      let nr = r, nc = c;
      for (;;) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tc < 0 || tr >= state.n || tc >= state.n) break;

        const other = grid[tr][tc];
        if (!other) {                       // slide on
          grid[tr][tc] = tile;
          grid[nr][nc] = null;
          nr = tr; nc = tc;
          continue;
        }
        if (other.v === tile.v && !other.mergedNow && !tile.mergedNow) {
          other.v *= 2;                     // absorb this tile
          other.mergedNow = true;
          grid[nr][nc] = null;
          tile.dead = true;
          tile.r = tr; tile.c = tc;         // it still slides into place first
          gained += other.v;
          if (other.v >= state.target && !state.won) winNow();
        }
        break;
      }

      if (!tile.dead) {
        if (nr !== tile.r || nc !== tile.c) moved = true;
        tile.r = nr; tile.c = nc;
      } else {
        moved = true;
      }
    }
  }

  if (!moved) return;

  state.history.push(before);
  if (state.history.length > 12) state.history.shift();

  state.score += gained;
  if (state.score > state.best) { state.best = state.score; saveBest(); }
  if (gained) { sfxMerge(gained); showGain(gained); } else sfxSlide();

  state.busy = true;
  render();

  // Let the slide finish, then clear what merged and drop the new tile in.
  setTimeout(() => {
    state.tiles = state.tiles.filter(t => !t.dead);
    addTile();
    state.busy = false;
    render();
    save();
    if (!canMove()) gameOver();
  }, 110);
}

function canMove() {
  if (emptyCells().length) return true;
  const grid = gridOf();
  for (let r = 0; r < state.n; r++) {
    for (let c = 0; c < state.n; c++) {
      const v = grid[r][c].v;
      if (r + 1 < state.n && grid[r + 1][c].v === v) return true;
      if (c + 1 < state.n && grid[r][c + 1].v === v) return true;
    }
  }
  return false;
}

function winNow() {
  state.won = true;
  sfxWin();
  setTimeout(() => {
    if (state.over) return;
    overTitle.textContent = state.target + ' reached';
    overText.textContent = 'Keep going for a bigger tile, or start again.';
    overMain.textContent = 'Keep going';
    overUndo.hidden = true;
    over.hidden = false;
  }, 220);
}

function gameOver() {
  state.over = true;
  sfxOver();
  overTitle.textContent = 'No moves left';
  overText.textContent = 'Score ' + state.score + ' · best ' + state.best;
  overMain.textContent = 'New game';
  overUndo.hidden = state.history.length === 0;
  over.hidden = false;
  clearSave();
}

// ---------------------------------------------------------------- undo
function snapshot() {
  return {
    tiles: state.tiles.filter(t => !t.dead).map(t => ({ id: t.id, r: t.r, c: t.c, v: t.v })),
    score: state.score,
    nextId: state.nextId,
  };
}

function undo() {
  const last = state.history.pop();
  if (!last) return;
  state.tiles = last.tiles.map(t => ({ ...t }));
  state.score = last.score;
  state.nextId = last.nextId;
  state.over = false;
  over.hidden = true;
  render(true);
  save();
}

// ---------------------------------------------------------------- storage
function save() {
  if (state.over) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      n: state.n, target: state.target, score: state.score, won: state.won,
      tiles: state.tiles.filter(t => !t.dead).map(t => ({ id: t.id, r: t.r, c: t.c, v: t.v })),
      nextId: state.nextId,
    }));
  } catch { /* storage blocked: play on without it */ }
}

function restore() {
  let data;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch { return false; }
  if (!data || !data.tiles || !data.tiles.length) return false;

  state.n = data.n || 4;
  state.target = data.target || 2048;
  state.tiles = data.tiles;
  state.score = data.score || 0;
  state.won = !!data.won;
  state.nextId = data.nextId || (Math.max(...data.tiles.map(t => t.id)) + 1);
  state.over = false;
  state.best = loadBest()[bestKey()] || 0;

  sizeSel.value = String(state.n);
  targetSel.value = String(state.target);
  buildBoard();
  render(true);
  return true;
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch { /* nothing to clean up */ }
}

function loadBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY) || '{}') || {}; } catch { return {}; }
}

function saveBest() {
  const best = loadBest();
  best[bestKey()] = state.best;
  try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch { /* ignore */ }
}

// ---------------------------------------------------------------- sound
let audio = null;

function initAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx) audio = new Ctx();
}

function tone(freq, dur, type = 'triangle', peak = 0.08, delay = 0) {
  if (!state.sound || !audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(peak, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.03);
}

function sfxSlide() { tone(240, 0.05, 'square', 0.03); }
// Bigger merges ring higher, so the board sounds like it is climbing.
function sfxMerge(gained) { tone(300 + Math.min(9, Math.log2(gained)) * 70, 0.1, 'triangle', 0.08); }
function sfxWin()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.1, i * 0.1)); }
function sfxOver()  { [392, 311, 233].forEach((f, i) => tone(f, 0.26, 'sawtooth', 0.08, i * 0.12)); }

// ---------------------------------------------------------------- render
const boardEl = document.getElementById('board');
const scoreOut = document.getElementById('scoreOut');
const bestOut = document.getElementById('bestOut');
const undoBtn = document.getElementById('undoBtn');
const newBtn = document.getElementById('newBtn');
const soundBtn = document.getElementById('soundBtn');
const sizeSel = document.getElementById('sizeSel');
const targetSel = document.getElementById('targetSel');
const over = document.getElementById('over');
const overTitle = document.getElementById('overTitle');
const overText = document.getElementById('overText');
const overMain = document.getElementById('overMain');
const overUndo = document.getElementById('overUndo');

const nodes = new Map();       // tile id -> element

function buildBoard() {
  boardEl.innerHTML = '';
  nodes.clear();
  boardEl.style.setProperty('--n', state.n);
  boardEl.style.setProperty('--gap', state.n > 4 ? '7px' : '10px');

  for (let r = 0; r < state.n; r++) {
    for (let c = 0; c < state.n; c++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.setProperty('--r', r);
      slot.style.setProperty('--c', c);
      boardEl.appendChild(slot);
    }
  }
}

function valueClass(v) {
  return v > 2048 ? 'vbig' : 'v' + v;
}

function render(instant = false) {
  const seen = new Set();

  for (const t of state.tiles) {
    seen.add(t.id);
    let el = nodes.get(t.id);

    if (!el) {
      el = document.createElement('div');
      el.className = 'tile';
      el.style.setProperty('--r', t.r);
      el.style.setProperty('--c', t.c);
      boardEl.appendChild(el);
      nodes.set(t.id, el);
      if (!instant) el.classList.add('spawn');
    }

    el.style.setProperty('--r', t.r);
    el.style.setProperty('--c', t.c);
    el.className = 'tile ' + valueClass(t.v) +
      (el.classList.contains('spawn') && !instant ? ' spawn' : '') +
      (t.mergedNow ? ' merged' : '');
    el.textContent = t.v;

    // Long numbers have to shrink to fit their tile.
    const digits = String(t.v).length;
    el.style.fontSize = 'min(' + (46 - digits * 5) + 'px, ' + (42 / state.n) + 'vh)';
    el.style.zIndex = t.dead ? 1 : 2;
  }

  for (const [id, el] of nodes) {
    if (seen.has(id)) continue;
    el.remove();
    nodes.delete(id);
  }

  scoreOut.textContent = state.score;
  bestOut.textContent = state.best;
  undoBtn.disabled = state.history.length === 0 || state.busy;
}

function showGain(gained) {
  const span = document.createElement('span');
  span.className = 'gain';
  span.textContent = '+' + gained;
  scoreOut.parentElement.appendChild(span);
  setTimeout(() => span.remove(), 600);
}

// ---------------------------------------------------------------- input
let touchStart = null;

boardEl.addEventListener('pointerdown', e => {
  touchStart = { x: e.clientX, y: e.clientY };
});

// The release is watched on the window, so a swipe that runs off the board
// still counts.
window.addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  touchStart = null;
  if (Math.hypot(dx, dy) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

window.addEventListener('pointercancel', () => { touchStart = null; });

const KEYS = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right',
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
  const dir = KEYS[e.key];
  if (dir) { e.preventDefault(); move(dir); return; }
  if (e.key === 'u' || e.key === 'U') undo();
});

undoBtn.addEventListener('click', undo);
newBtn.addEventListener('click', () => { clearSave(); newGame(); });
sizeSel.addEventListener('change', () => { clearSave(); newGame(); });
targetSel.addEventListener('change', () => { clearSave(); newGame(); });

soundBtn.addEventListener('click', () => {
  state.sound = !state.sound;
  soundBtn.textContent = state.sound ? 'Sound on' : 'Sound off';
});

overMain.addEventListener('click', () => {
  if (state.over) { clearSave(); newGame(); }
  over.hidden = true;                     // "keep going" after a win
});

overUndo.addEventListener('click', () => { undo(); });

document.addEventListener('pointerdown', () => {
  initAudio();
  if (audio && audio.state === 'suspended') audio.resume();
});

if (!restore()) newGame();
</script>
</body>
</html>
