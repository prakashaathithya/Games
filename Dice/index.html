<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>3D Dice Roller</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none;
    background: #14161c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e9e6df;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; touch-action: none; }

  /* ---- settings ---- */
  #gear {
    position: fixed; z-index: 12;
    top: max(12px, env(safe-area-inset-top)); left: 12px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    font-size: 19px; line-height: 1;
    color: #d7dbe3;
    background: rgba(22, 25, 32, 0.72);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 13px;
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  #gear:hover { background: rgba(38, 43, 54, 0.85); }
  #gear[aria-expanded="true"] { background: rgba(52, 60, 76, 0.9); }

  #panel {
    position: fixed; z-index: 11;
    top: calc(max(12px, env(safe-area-inset-top)) + 54px); left: 12px;
    width: min(330px, calc(100vw - 24px));
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 14px;
    padding: 14px 16px;
    background: rgba(22, 25, 32, 0.84);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.42);
    backdrop-filter: blur(14px);
    transform-origin: top left;
    transition: opacity .16s ease, transform .16s ease;
  }
  #panel[hidden] {
    display: grid;                       /* keep the grid, just hide it visually */
    opacity: 0; pointer-events: none;
    transform: scale(0.96) translateY(-6px);
  }

  #panel label {
    display: flex; flex-direction: column; gap: 7px; min-width: 0;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #99a1ae;
  }
  #panel select, #panel input[type="number"] {
    font: inherit; font-size: 15px; width: 100%;
    color: #e9e6df; background: #2a2f3a;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; padding: 8px 9px;
    min-height: 40px; outline: none;
  }
  #panel select:focus, #panel input:focus { border-color: #7f9cf5; }
  #panel input[type="color"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 40px; padding: 3px;
    background: #2a2f3a; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; cursor: pointer;
  }
  #panel input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  #panel input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
  #panel input[type="color"]::-moz-color-swatch { border: none; border-radius: 6px; }

  /* ---- readout ---- */
  #result {
    position: fixed; left: 0; right: 0; z-index: 10;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; pointer-events: none;
  }
  #dievals {
    font-size: 14px; letter-spacing: 0.08em; color: #c3cad6;
    min-height: 18px; text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
  #total {
    font-size: 54px; font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 22px rgba(0,0,0,0.75); min-height: 58px;
  }
  #hint {
    font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase;
    color: #7c8695; margin-top: 2px; padding: 0 14px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
  .rolling #total, .rolling #dievals { opacity: 0.22; transition: opacity .15s; }

  @media (max-width: 640px) {
    #panel {
      left: 10px; right: 10px; width: auto;
      top: calc(max(12px, env(safe-area-inset-top)) + 52px);
    }
    #total { font-size: 46px; min-height: 50px; }
    #hint { font-size: 10px; letter-spacing: 0.1em; }
  }
  @media (max-height: 460px) {
    #total { font-size: 34px; min-height: 38px; }
    #dievals { font-size: 12px; }
  }
</style>
</head>
<body>

<button id="gear" aria-expanded="true" aria-controls="panel" aria-label="Settings">&#9881;</button>

<div id="panel">
  <label>Dice
    <input id="count" type="number" min="1" max="8" step="1" value="2" inputmode="numeric">
  </label>
  <label>Sides
    <select id="sides">
      <option value="4">d4</option>
      <option value="6" selected>d6</option>
      <option value="8">d8</option>
      <option value="10">d10</option>
      <option value="12">d12</option>
      <option value="20">d20</option>
    </select>
  </label>
  <label>Faces
    <select id="style">
      <option value="numbers" selected>Numbers</option>
      <option value="pips">Dots</option>
    </select>
  </label>
  <label>Dice color
    <input id="dieColor" type="color" value="#f4efe4">
  </label>
  <label>Table
    <input id="tableColor" type="color" value="#2b6b52">
  </label>
  <label>Background
    <input id="bgColor" type="color" value="#14161c">
  </label>
</div>

<div id="result">
  <div id="dievals"></div>
  <div id="total"></div>
  <div id="hint">Tap to roll &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; pinch to zoom</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------------------------------------------------------------- constants
const DIE_SIZE = 0.95;      // circumradius of a die
const MAX_ROLL_TIME = 7000; // ms before a roll is force-resolved
const STORE_KEY = 'dice3d.settings';

const clamp = THREE.MathUtils.clamp;
const isTouch = matchMedia('(pointer: coarse)').matches;

// The table is re-shaped to match the window, so a phone in portrait gets a
// tall narrow table rather than a small square one adrift in empty backdrop.
let boardX = 7, boardZ = 7;

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.75 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
scene.fog = new THREE.Fog(0x14161c, 26, 60);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 140);

scene.add(new THREE.HemisphereLight(0x9fb4d4, 0x20242c, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(6, 18, 8);
key.castShadow = true;
key.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 48;
key.shadow.bias = -0.0008;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa8c0ff, 0.35);
fill.position.set(-8, 6, -6);
scene.add(fill);

const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshStandardMaterial({ color: 0x2b6b52, roughness: 0.95, metalness: 0.0 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

// ---------------------------------------------------------------- physics
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -34, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 12;

const matDie = new CANNON.Material('die');
const matFloor = new CANNON.Material('floor');
world.addContactMaterial(new CANNON.ContactMaterial(matDie, matFloor, { friction: 0.32, restitution: 0.36 }));
world.addContactMaterial(new CANNON.ContactMaterial(matDie, matDie, { friction: 0.06, restitution: 0.42 }));

const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: matFloor });
floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(floorBody);

// Four invisible walls, each facing inward. Positions are set by layoutBoard().
const walls = [0, Math.PI, Math.PI / 2, -Math.PI / 2].map(yaw => {
  const body = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: matFloor });
  body.quaternion.setFromEuler(0, yaw, 0);
  world.addBody(body);
  return body;
});

// ---------------------------------------------------------------- geometry
// A pentagonal trapezohedron (the classic d10). Its kite faces are only planar
// when the ring sits at 0.10557 of the apex height, so that ratio is fixed.
function trapezohedronGeometry(scale) {
  const h = 1, c = 0.10557, R = 1;
  const T = [0, 0, h], B = [0, 0, -h];
  const upper = [], lower = [];
  for (let i = 0; i < 5; i++) {
    const a = (i * 2 * Math.PI) / 5;
    upper.push([R * Math.cos(a), R * Math.sin(a), c]);
    lower.push([R * Math.cos(a + Math.PI / 5), R * Math.sin(a + Math.PI / 5), -c]);
  }

  const tris = [];
  const push = (a, b, cc) => tris.push(a, b, cc);
  for (let i = 0; i < 5; i++) {
    const j = (i + 1) % 5;
    push(T, upper[i], lower[i]);       // upper kite, split into two triangles
    push(T, lower[i], upper[j]);
    push(B, lower[j], upper[j]);       // lower kite, split into two triangles
    push(B, upper[j], lower[i]);
  }

  const pos = new Float32Array(tris.length * 3);
  tris.forEach((v, i) => {
    pos[i * 3] = v[0] * scale;
    pos[i * 3 + 1] = v[2] * scale;     // model is z-up, scene is y-up
    pos[i * 3 + 2] = -v[1] * scale;
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return g;
}

function baseGeometry(sides) {
  switch (sides) {
    case 4:  return new THREE.TetrahedronGeometry(DIE_SIZE * 1.2);
    case 6:  return new THREE.BoxGeometry(DIE_SIZE * 1.18, DIE_SIZE * 1.18, DIE_SIZE * 1.18);
    case 8:  return new THREE.OctahedronGeometry(DIE_SIZE * 1.05);
    case 10: return trapezohedronGeometry(DIE_SIZE);
    case 12: return new THREE.DodecahedronGeometry(DIE_SIZE);
    case 20: return new THREE.IcosahedronGeometry(DIE_SIZE);
    default: throw new Error('unsupported side count: ' + sides);
  }
}

// Triangular faces waste most of the circle their UVs are mapped into, so their
// markings are drawn smaller to stay clear of the corners.
const FACE_INSET = { 4: 0.62, 6: 1.0, 8: 0.62, 10: 0.78, 12: 0.92, 20: 0.62 };

// Group the triangle soup into flat faces (triangles sharing a normal), rebuild
// it with one material group per face, and give each face UVs that centre its
// own marking texture.
function facetGeometry(base) {
  const geo = base.index ? base.toNonIndexed() : base;
  const pos = geo.attributes.position;
  const triCount = pos.count / 3;

  const tris = [];
  for (let t = 0; t < triCount; t++) {
    const a = new THREE.Vector3().fromBufferAttribute(pos, t * 3);
    const b = new THREE.Vector3().fromBufferAttribute(pos, t * 3 + 1);
    const c = new THREE.Vector3().fromBufferAttribute(pos, t * 3 + 2);
    const n = new THREE.Vector3()
      .subVectors(b, a)
      .cross(new THREE.Vector3().subVectors(c, a))
      .normalize();
    tris.push({ v: [a, b, c], n });
  }

  const faces = [];
  for (const t of tris) {
    let face = faces.find(f => f.normal.dot(t.n) > 0.999);
    if (!face) { face = { normal: t.n.clone(), tris: [] }; faces.push(face); }
    face.tris.push(t);
  }

  const positions = [], normals = [], uvs = [];
  const up = new THREE.Vector3(0, 1, 0), side = new THREE.Vector3(1, 0, 0);
  const out = new THREE.BufferGeometry();
  let written = 0;

  faces.forEach((face, fi) => {
    const n = face.normal;
    const tangent = new THREE.Vector3().crossVectors(Math.abs(n.y) < 0.9 ? up : side, n).normalize();
    const bitan = new THREE.Vector3().crossVectors(n, tangent).normalize();

    const centre = new THREE.Vector3();
    let count = 0;
    for (const t of face.tris) for (const v of t.v) { centre.add(v); count++; }
    centre.divideScalar(count);

    let maxR = 0;
    const d = new THREE.Vector3();
    for (const t of face.tris) for (const v of t.v) {
      d.subVectors(v, centre);
      maxR = Math.max(maxR, Math.hypot(d.dot(tangent), d.dot(bitan)));
    }

    const start = written;
    for (const t of face.tris) for (const v of t.v) {
      positions.push(v.x, v.y, v.z);
      normals.push(n.x, n.y, n.z);
      d.subVectors(v, centre);
      uvs.push(0.5 + (d.dot(tangent) / maxR) * 0.42, 0.5 + (d.dot(bitan) / maxR) * 0.42);
      written++;
    }
    out.addGroup(start, written - start, fi);
  });

  out.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  out.computeBoundingSphere();

  return { geometry: out, faceNormals: faces.map(f => f.normal.clone()) };
}

// Opposite faces sum to sides+1, like a real die. Shapes with no antipodal
// faces (the d4) simply get sequential numbers.
function assignValues(faceNormals) {
  const total = faceNormals.length;
  const values = new Array(total).fill(0);
  const pool = [];
  for (let v = 1; v <= total; v++) pool.push(v);

  for (let i = 0; i < total; i++) {
    if (values[i]) continue;
    const v = pool.shift();
    values[i] = v;

    let opp = -1, best = -0.99;
    for (let j = 0; j < total; j++) {
      if (j === i || values[j]) continue;
      const dot = faceNormals[i].dot(faceNormals[j]);
      if (dot < best) { best = dot; opp = j; }
    }
    const mirror = total + 1 - v;
    if (opp >= 0 && pool.includes(mirror)) {
      values[opp] = mirror;
      pool.splice(pool.indexOf(mirror), 1);
    }
  }
  return values;
}

// Build the cannon hull from the exact triangles being rendered, so the physics
// shape and the visible die can never disagree.
function convexShape(geometry) {
  const pos = geometry.attributes.position;
  const vertices = [], faces = [], lookup = new Map();

  for (let i = 0; i < pos.count; i += 3) {
    const face = [];
    for (let k = 0; k < 3; k++) {
      const x = pos.getX(i + k), y = pos.getY(i + k), z = pos.getZ(i + k);
      const keyStr = x.toFixed(4) + ',' + y.toFixed(4) + ',' + z.toFixed(4);
      let idx = lookup.get(keyStr);
      if (idx === undefined) {
        idx = vertices.length;
        lookup.set(keyStr, idx);
        vertices.push(new CANNON.Vec3(x, y, z));
      }
      face.push(idx);
    }
    faces.push(face);
  }
  return new CANNON.ConvexPolyhedron({ vertices, faces });
}

// ---------------------------------------------------------------- appearance
// Ink is picked from the body colour so light and dark dice both stay readable.
function inkFor(hex) {
  const c = new THREE.Color(hex);
  const lum = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  return lum > 0.45 ? '#1b1e25' : '#f7f4ec';
}

// Standard 3x3 dot layouts. Values with no layout fall back to a numeral.
const PIP_GRID = {
  1: [[1, 1]],
  2: [[0, 0], [2, 2]],
  3: [[0, 0], [1, 1], [2, 2]],
  4: [[0, 0], [2, 0], [0, 2], [2, 2]],
  5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]],
  6: [[0, 0], [0, 1], [0, 2], [2, 0], [2, 1], [2, 2]],
  7: [[0, 0], [0, 1], [0, 2], [1, 1], [2, 0], [2, 1], [2, 2]],
  8: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1], [2, 2]],
  9: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]],
};

function faceTexture(value, bodyHex, ink, style, inset) {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = bodyHex;
  ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = ink;

  if (style === 'pips' && PIP_GRID[value]) {
    const step = S * 0.20 * inset;
    const r = S * 0.072 * inset;
    for (const [col, row] of PIP_GRID[value]) {
      ctx.beginPath();
      ctx.arc(S / 2 + (col - 1) * step, S / 2 + (row - 1) * step, r, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    const label = String(value);
    const size = (label.length > 1 ? 118 : 150) * inset;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 ' + size + 'px "Helvetica Neue", Arial, sans-serif';
    ctx.fillText(label, S / 2, S / 2 - size * 0.03);

    if (value === 6 || value === 9) {      // disambiguate the rotatable pair
      const w = ctx.measureText(label).width;
      ctx.fillRect(S / 2 - w / 2, S / 2 + size * 0.42, w, Math.max(4, size * 0.055));
    }
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------------------------------------------------------------- die specs
const geoCache = new Map();
function dieSpec(sides) {
  if (geoCache.has(sides)) return geoCache.get(sides);
  const { geometry, faceNormals } = facetGeometry(baseGeometry(sides));
  const spec = {
    sides,
    geometry,
    faceNormals,
    values: assignValues(faceNormals),
    shape: convexShape(geometry),
  };
  geoCache.set(sides, spec);
  return spec;
}

let materials = null;
function buildMaterials(spec) {
  disposeMaterials();
  const ink = inkFor(dieColor);
  const inset = FACE_INSET[spec.sides] || 1;
  materials = spec.values.map(v => new THREE.MeshStandardMaterial({
    map: faceTexture(v, dieColor, ink, faceStyle, inset),
    roughness: 0.42,
    metalness: 0.05,
  }));
  return materials;
}

function disposeMaterials() {
  if (!materials) return;
  for (const m of materials) { m.map.dispose(); m.dispose(); }
  materials = null;
}

// ---------------------------------------------------------------- dice
let dice = [];
let dieColor = '#f4efe4';
let faceStyle = 'numbers';

function buildDice(count, sides) {
  for (const d of dice) { scene.remove(d.mesh); world.removeBody(d.body); }
  dice = [];

  const spec = dieSpec(sides);
  const mats = buildMaterials(spec);

  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(spec.geometry, mats);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const body = new CANNON.Body({ mass: 1, shape: spec.shape, material: matDie });
    body.allowSleep = true;
    body.sleepSpeedLimit = 0.12;
    body.sleepTimeLimit = 0.25;
    body.linearDamping = 0.06;
    body.angularDamping = 0.06;
    body.addEventListener('collide', onCollide);
    world.addBody(body);

    dice.push({ mesh, body, spec });
  }
  parkDice();
}

// Repaint in place: colour and face style change without disturbing a result.
function repaintDice() {
  if (!dice.length) return;
  const mats = buildMaterials(dice[0].spec);
  for (const d of dice) d.mesh.material = mats;
}

// Idle layout, before the first roll.
function parkDice() {
  const step = Math.min(2.2, (boardX * 1.5) / Math.max(1, dice.length));
  dice.forEach((d, i) => {
    d.body.position.set((i - (dice.length - 1) / 2) * step, DIE_SIZE * 1.1, 0);
    d.body.velocity.setZero();
    d.body.angularVelocity.setZero();
    d.body.quaternion.setFromEuler(rand(0, 6.28), rand(0, 6.28), rand(0, 6.28));
    d.body.wakeUp();
  });
}

// ---------------------------------------------------------------- board fit
// The table tracks the window shape, so the felt fills the screen in portrait
// and landscape alike instead of leaving a wide margin of empty backdrop.
function layoutBoard() {
  const aspect = window.innerWidth / window.innerHeight;
  if (aspect >= 1) {
    boardZ = 5.4;
    boardX = clamp(boardZ * aspect * 0.92, 5.4, 12);
  } else {
    boardX = 4.8;
    boardZ = clamp((boardX / aspect) * 0.92, 4.8, 11);
  }

  walls[0].position.set(0, 0, -boardZ);
  walls[1].position.set(0, 0, boardZ);
  walls[2].position.set(-boardX, 0, 0);
  walls[3].position.set(boardX, 0, 0);

  floorMesh.geometry.dispose();
  floorMesh.geometry = new THREE.PlaneGeometry(boardX * 2, boardZ * 2);

  const reach = Math.max(boardX, boardZ) + 2;
  key.shadow.camera.left = -reach;
  key.shadow.camera.right = reach;
  key.shadow.camera.top = reach;
  key.shadow.camera.bottom = -reach;
  key.shadow.camera.updateProjectionMatrix();

  fitCamera();
}

// ---------------------------------------------------------------- rolling
const rand = (a, b) => a + Math.random() * (b - a);

let rolling = false;
let rollStart = 0;
let calmFrames = 0;

function roll() {
  rolling = true;
  rollStart = performance.now();
  calmFrames = 0;
  document.body.classList.add('rolling');
  hint.style.display = 'none';
  vibrate(12);

  const step = Math.min(1.6, (boardX * 1.2) / Math.max(1, dice.length));
  dice.forEach((d, i) => {
    const lane = (i - (dice.length - 1) / 2) * step;
    d.body.position.set(lane + rand(-0.5, 0.5), 6 + i * 1.4, -boardZ + 1.6 + rand(-0.4, 0.4));
    d.body.quaternion.setFromEuler(rand(0, 6.28), rand(0, 6.28), rand(0, 6.28));
    d.body.velocity.set(rand(-3, 3), rand(-4, -1), rand(7, 12));
    d.body.angularVelocity.set(rand(-22, 22), rand(-22, 22), rand(-22, 22));
    d.body.wakeUp();
  });
}

function atRest(body) {
  return body.sleepState === CANNON.Body.SLEEPING ||
    (body.velocity.lengthSquared() < 0.02 && body.angularVelocity.lengthSquared() < 0.02);
}

// A d4 has no upward face — the value read is the one lying face down.
const readVec = new THREE.Vector3();
function readDie(d) {
  const readDown = d.spec.values.length === 4;
  const target = new THREE.Vector3(0, readDown ? -1 : 1, 0);
  let bestDot = -Infinity, bestIdx = 0;
  for (let i = 0; i < d.spec.faceNormals.length; i++) {
    readVec.copy(d.spec.faceNormals[i]).applyQuaternion(d.mesh.quaternion);
    const dot = readVec.dot(target);
    if (dot > bestDot) { bestDot = dot; bestIdx = i; }
  }
  return { value: d.spec.values[bestIdx], confidence: bestDot };
}

function settle() {
  const reads = dice.map(readDie);
  const cocked = reads.some(r => r.confidence < 0.7);

  // Landed on an edge or stacked on another die: nudge and keep simulating.
  if (cocked && performance.now() - rollStart < MAX_ROLL_TIME) {
    dice.forEach(d => {
      d.body.wakeUp();
      d.body.velocity.set(rand(-1.5, 1.5), 4.5, rand(-1.5, 1.5));
      d.body.angularVelocity.set(rand(-9, 9), rand(-9, 9), rand(-9, 9));
    });
    calmFrames = 0;
    return;
  }

  rolling = false;
  document.body.classList.remove('rolling');
  const values = reads.map(r => r.value);
  dievals.textContent = values.length > 1 ? values.join('  ·  ') : '';
  total.textContent = values.reduce((a, b) => a + b, 0);
  vibrate([16, 40, 26]);
}

// ---------------------------------------------------------------- sound
let audio = null, noise = null, lastClack = 0;

function initAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audio = new Ctx();
  const len = Math.floor(audio.sampleRate * 0.2);
  noise = audio.createBuffer(1, len, audio.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
}

function clack(strength) {
  if (!audio || audio.state !== 'running') return;
  const now = performance.now();
  if (now - lastClack < 35) return;
  lastClack = now;

  const src = audio.createBufferSource();
  src.buffer = noise;
  const band = audio.createBiquadFilter();
  band.type = 'bandpass';
  band.frequency.value = 1400 + Math.random() * 1600;
  band.Q.value = 1.6;

  const gain = audio.createGain();
  const t = audio.currentTime;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.35 * strength + 0.01, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);

  src.connect(band).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + 0.12);
}

function onCollide(e) {
  const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
  if (v > 1.4) clack(Math.min(1, v / 11));
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ---------------------------------------------------------------- camera
// Hand-rolled orbit: drag to swing, pinch or wheel to zoom, tap to roll.
const orbit = { theta: 0, phi: 0.62, radius: 19, target: new THREE.Vector3(0, 0.6, 0) };
const PHI_MIN = 0.18, PHI_MAX = 1.34;
const RADIUS_MIN = 9, RADIUS_MAX = 42;

function updateCamera() {
  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * cp,
    orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
}

// Frame the whole table. Skipped once the user has zoomed by hand, so a resize
// never undoes their framing.
let userZoomed = false;
function fitCamera() {
  if (userZoomed) return;
  const aspect = window.innerWidth / window.innerHeight;
  const halfV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const distX = (boardX * 1.08) / (halfV * aspect);
  const distZ = (boardZ * 1.08 * 0.82) / halfV;   // depth is foreshortened by the tilt
  orbit.radius = clamp(Math.max(distX, distZ), RADIUS_MIN, RADIUS_MAX);
}

const pointers = new Map();
let dragMoved = 0, dragStart = 0, pinchDist = 0;

function onPointerDown(e) {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { dragMoved = 0; dragStart = performance.now(); }
  if (pointers.size === 2) pinchDist = pointerSpread();
  renderer.domElement.setPointerCapture?.(e.pointerId);
}

function onPointerMove(e) {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    dragMoved += Math.hypot(dx, dy);
    orbit.theta -= dx * 0.006;
    orbit.phi = clamp(orbit.phi - dy * 0.005, PHI_MIN, PHI_MAX);
  } else if (pointers.size === 2) {
    dragMoved += 50;                       // a pinch is never a tap
    const d = pointerSpread();
    if (pinchDist > 0) {
      orbit.radius = clamp(orbit.radius * (pinchDist / d), RADIUS_MIN, RADIUS_MAX);
      userZoomed = true;
    }
    pinchDist = d;
  }
}

function onPointerUp(e) {
  const wasSingle = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;

  const quick = performance.now() - dragStart < 500;
  if (wasSingle && dragMoved < 10 && quick) triggerRoll();
}

function pointerSpread() {
  const [a, b] = [...pointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);
renderer.domElement.addEventListener('pointercancel', onPointerUp);
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.radius = clamp(orbit.radius * (1 + Math.sign(e.deltaY) * 0.09), RADIUS_MIN, RADIUS_MAX);
  userZoomed = true;
}, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());   // iOS page zoom

// ---------------------------------------------------------------- main loop
let last = performance.now();
function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  world.step(1 / 60, dt, 4);

  for (const d of dice) {
    d.mesh.position.copy(d.body.position);
    d.mesh.quaternion.copy(d.body.quaternion);
  }

  if (rolling && now - rollStart > 400) {
    if (dice.every(d => atRest(d.body))) calmFrames++;
    else calmFrames = 0;
    if (calmFrames > 8 || now - rollStart > MAX_ROLL_TIME) settle();
  }

  updateCamera();
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- ui
const gear = document.getElementById('gear');
const panel = document.getElementById('panel');
const countInput = document.getElementById('count');
const sidesInput = document.getElementById('sides');
const styleInput = document.getElementById('style');
const dieColorInput = document.getElementById('dieColor');
const tableColorInput = document.getElementById('tableColor');
const bgColorInput = document.getElementById('bgColor');
const dievals = document.getElementById('dievals');
const total = document.getElementById('total');
const hint = document.getElementById('hint');

function applyScene() {
  const bg = new THREE.Color(bgColorInput.value);
  scene.background = bg;
  scene.fog.color = bg;
  document.body.style.background = bgColorInput.value;
  floorMesh.material.color.set(tableColorInput.value);
}

function rebuild() {
  const n = clamp(parseInt(countInput.value, 10) || 1, 1, 8);
  countInput.value = n;
  buildDice(n, parseInt(sidesInput.value, 10));
  dievals.textContent = '';
  total.textContent = '';
  hint.style.display = '';
  rolling = false;
  document.body.classList.remove('rolling');
}

function triggerRoll() {
  initAudio();
  if (audio && audio.state === 'suspended') audio.resume();
  roll();
}

function setPanelOpen(open) {
  panel.hidden = !open;
  gear.setAttribute('aria-expanded', String(open));
}

// ---- settings persistence
function saveSettings() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      count: countInput.value,
      sides: sidesInput.value,
      style: styleInput.value,
      die: dieColorInput.value,
      table: tableColorInput.value,
      bg: bgColorInput.value,
    }));
  } catch { /* private mode, storage full: not worth interrupting a roll */ }
}

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!saved) return;
    if (saved.count) countInput.value = saved.count;
    if (saved.sides) sidesInput.value = saved.sides;
    if (saved.style) styleInput.value = saved.style;
    if (saved.die) dieColorInput.value = saved.die;
    if (saved.table) tableColorInput.value = saved.table;
    if (saved.bg) bgColorInput.value = saved.bg;
  } catch { /* ignore malformed storage */ }
}

gear.addEventListener('click', () => setPanelOpen(panel.hidden));

countInput.addEventListener('change', () => { rebuild(); saveSettings(); });
sidesInput.addEventListener('change', () => { rebuild(); saveSettings(); });
styleInput.addEventListener('change', () => {
  faceStyle = styleInput.value;
  repaintDice();
  saveSettings();
});
dieColorInput.addEventListener('input', () => {
  dieColor = dieColorInput.value;
  repaintDice();
});
dieColorInput.addEventListener('change', saveSettings);
tableColorInput.addEventListener('input', applyScene);
tableColorInput.addEventListener('change', saveSettings);
bgColorInput.addEventListener('input', applyScene);
bgColorInput.addEventListener('change', saveSettings);

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); triggerRoll(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutBoard();
});

loadSettings();
dieColor = dieColorInput.value;
faceStyle = styleInput.value;
setPanelOpen(!isTouch);          // phones start with the board unobstructed
applyScene();
layoutBoard();
rebuild();
animate();
</script>
</body>
</html>
