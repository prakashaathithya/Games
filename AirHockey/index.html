<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>Sling Air Hockey</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none;
    background: #0f1218;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e9e6df;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; touch-action: none; }

  /* ---- settings ---- */
  #gear {
    position: fixed; z-index: 12;
    top: max(12px, env(safe-area-inset-top)); left: 12px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    font-size: 19px; line-height: 1; color: #d7dbe3;
    background: rgba(20, 24, 32, 0.74);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 13px;
    backdrop-filter: blur(10px);
    cursor: pointer;
  }
  #gear[aria-expanded="true"] { background: rgba(52, 60, 76, 0.9); }

  #panel {
    position: fixed; z-index: 11;
    top: calc(max(12px, env(safe-area-inset-top)) + 54px); left: 12px;
    width: min(320px, calc(100vw - 24px));
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 14px; padding: 14px 16px;
    background: rgba(20, 24, 32, 0.86);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    backdrop-filter: blur(14px);
    transform-origin: top left;
    transition: opacity .16s ease, transform .16s ease;
  }
  #panel[hidden] {
    display: grid; opacity: 0; pointer-events: none;
    transform: scale(0.96) translateY(-6px);
  }
  #panel label {
    display: flex; flex-direction: column; gap: 7px; min-width: 0;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #99a1ae;
  }
  #panel select {
    font: inherit; font-size: 15px; width: 100%;
    color: #e9e6df; background: #262c38;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; padding: 8px 9px; min-height: 40px; outline: none;
  }
  #panel select:focus { border-color: #7f9cf5; }
  #panel .wide { grid-column: 1 / -1; }
  #panel button {
    font: inherit; font-size: 14px; font-weight: 600; width: 100%;
    color: #e9e6df; background: #303849;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9px; padding: 10px; min-height: 42px; cursor: pointer;
  }
  #panel button:hover { background: #3a4457; }

  /* ---- scoreboard ---- */
  .score {
    position: fixed; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: center; gap: 12px; align-items: baseline;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #topScore { top: max(14px, env(safe-area-inset-top)); transform: rotate(180deg); }
  #bottomScore { bottom: max(14px, env(safe-area-inset-bottom)); }
  .score .name {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #79828f; text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  }
  .score .pts {
    font-size: 34px; font-weight: 700; line-height: 1;
    text-shadow: 0 2px 16px rgba(0,0,0,0.8);
  }
  .score.active .name { color: #9fd8b4; }
  .score.active .pts { color: #ffffff; }

  #banner {
    position: fixed; inset: 0; z-index: 13;
    display: grid; place-items: center;
    background: rgba(10, 12, 17, 0.74);
    backdrop-filter: blur(6px);
    text-align: center; padding: 24px;
  }
  #banner[hidden] { display: none; }
  #banner h1 { margin: 0 0 6px; font-size: clamp(26px, 7vw, 42px); font-weight: 700; }
  #banner p { margin: 0 0 22px; color: #98a1ae; font-size: 14px; }
  #banner button {
    font: inherit; font-size: 15px; font-weight: 600;
    color: #10141b; background: #9fd8b4;
    border: none; border-radius: 11px;
    padding: 13px 26px; min-height: 46px; cursor: pointer;
  }

  #hint {
    position: fixed; left: 0; right: 0; z-index: 10;
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 58px);
    text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase;
    color: #7c8695; text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    padding: 0 16px;
  }
</style>
</head>
<body>

<button id="gear" aria-expanded="false" aria-controls="panel" aria-label="Settings">&#9881;</button>

<div id="panel" hidden>
  <label>Mode
    <select id="mode">
      <option value="ai" selected>vs Computer</option>
      <option value="local">2 players</option>
    </select>
  </label>
  <label>Difficulty
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
  </label>
  <label>Play to
    <select id="target">
      <option value="5">5 goals</option>
      <option value="7" selected>7 goals</option>
      <option value="11">11 goals</option>
    </select>
  </label>
  <label>Table
    <select id="tableStyle">
      <option value="ice" selected>Ice</option>
      <option value="slate">Slate</option>
      <option value="amber">Amber</option>
    </select>
  </label>
  <div class="wide"><button id="restart" type="button">New game</button></div>
</div>

<div class="score" id="topScore"><span class="name">Player 2</span><span class="pts">0</span></div>
<div class="score" id="bottomScore"><span class="name">Player 1</span><span class="pts">0</span></div>
<div id="hint">Pull back from the puck, release to fire</div>

<div id="banner" hidden>
  <div>
    <h1 id="bannerTitle">Player 1 wins</h1>
    <p id="bannerText">7 &ndash; 4</p>
    <button id="bannerButton" type="button">Play again</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- constants
// The puck is a disc sliding on a plane, so the whole simulation is 2D and
// hand-written: exact circle/wall reflection beats a general 3D solver here.
const PUCK_R = 0.52;
const PUCK_H = 0.24;
const RAIL_T = 0.5;
const RAIL_H = 0.62;

const MAX_PULL = 5.2;        // world units of drag that count as full power
const MAX_SPEED = 34;        // units per second at full power
const MIN_SPEED = 6;         // a flick still has to reach somewhere
const DRAG_K = 0.95;         // exponential velocity decay per second
const REST = 0.9;            // rail bounce
const STOP_SPEED = 0.6;      // below this the puck is considered at rest

const AI_ERROR = { easy: 0.30, normal: 0.155, hard: 0.06 };
const AI_POWER = { easy: [0.45, 0.7], normal: [0.6, 0.9], hard: [0.75, 1.0] };

const THEMES = {
  ice:   { felt: 0x2f5f7a, rail: 0xd9e3ea, line: 0xbcd3e2, bg: 0x0f1218 },
  slate: { felt: 0x39424f, rail: 0xc3ccd6, line: 0x9fb0c0, bg: 0x14161c },
  amber: { felt: 0x7d5322, rail: 0xf0dcb8, line: 0xe8c98d, bg: 0x1a1410 },
};

const clamp = THREE.MathUtils.clamp;
const isTouch = matchMedia('(pointer: coarse)').matches;

// Table half-extents, recomputed from the window shape.
let halfW = 5, halfL = 8, goalHalf = 2;

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.75 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xbcd0e6, 0x1b1f26, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.35);
key.position.set(5, 22, 7);
key.castShadow = true;
key.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
key.shadow.camera.near = 2;
key.shadow.camera.far = 60;
key.shadow.bias = -0.0009;
scene.add(key);

let theme = THEMES.ice;

// ---------------------------------------------------------------- table
const table = new THREE.Group();
scene.add(table);

const feltMat = new THREE.MeshStandardMaterial({ color: theme.felt, roughness: 0.72, metalness: 0.04 });
const railMat = new THREE.MeshStandardMaterial({ color: theme.rail, roughness: 0.45, metalness: 0.12 });
const lineMat = new THREE.MeshBasicMaterial({ color: theme.line, transparent: true, opacity: 0.5 });
const goalMat = new THREE.MeshBasicMaterial({ color: 0x9fd8b4, transparent: true, opacity: 0.34 });

// Everything on the table is rebuilt when the window changes shape, so the
// playfield always matches the screen rather than sitting in a wide margin.
function buildTable() {
  for (const child of [...table.children]) {
    table.remove(child);
    if (child.geometry) child.geometry.dispose();
  }

  const felt = new THREE.Mesh(new THREE.PlaneGeometry(halfW * 2, halfL * 2), feltMat);
  felt.rotation.x = -Math.PI / 2;
  felt.receiveShadow = true;
  table.add(felt);

  const addRail = (w, l, x, z) => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(w, RAIL_H, l), railMat);
    rail.position.set(x, RAIL_H / 2, z);
    rail.castShadow = true;
    rail.receiveShadow = true;
    table.add(rail);
  };

  const sideLen = halfL * 2 + RAIL_T * 2;
  addRail(RAIL_T, sideLen, -(halfW + RAIL_T / 2), 0);
  addRail(RAIL_T, sideLen, halfW + RAIL_T / 2, 0);

  const endSeg = halfW - goalHalf + RAIL_T;
  for (const z of [-(halfL + RAIL_T / 2), halfL + RAIL_T / 2]) {
    addRail(endSeg, RAIL_T, -(goalHalf + endSeg / 2 - RAIL_T / 2), z);
    addRail(endSeg, RAIL_T, goalHalf + endSeg / 2 - RAIL_T / 2, z);
  }

  const centre = new THREE.Mesh(new THREE.PlaneGeometry(halfW * 2, 0.08), lineMat);
  centre.rotation.x = -Math.PI / 2;
  centre.position.y = 0.012;
  table.add(centre);

  const ring = new THREE.Mesh(new THREE.RingGeometry(halfW * 0.24, halfW * 0.24 + 0.08, 48), lineMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.012;
  table.add(ring);

  for (const z of [-1, 1]) {
    const mouth = new THREE.Mesh(new THREE.PlaneGeometry(goalHalf * 2, 1.0), goalMat);
    mouth.rotation.x = -Math.PI / 2;
    mouth.position.set(0, 0.014, z * (halfL - 0.5));
    table.add(mouth);
  }

  const reach = Math.max(halfW, halfL) + 3;
  key.shadow.camera.left = -reach;
  key.shadow.camera.right = reach;
  key.shadow.camera.top = reach;
  key.shadow.camera.bottom = -reach;
  key.shadow.camera.updateProjectionMatrix();
}

// ---------------------------------------------------------------- puck
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(PUCK_R, PUCK_R, PUCK_H, 40),
  new THREE.MeshStandardMaterial({ color: 0x1b1f27, roughness: 0.36, metalness: 0.22 })
);
puck.castShadow = true;
puck.receiveShadow = true;
scene.add(puck);

const puckTop = new THREE.Mesh(
  new THREE.CircleGeometry(PUCK_R * 0.55, 32),
  new THREE.MeshBasicMaterial({ color: 0x9fd8b4, transparent: true, opacity: 0.75 })
);
puckTop.rotation.x = -Math.PI / 2;
scene.add(puckTop);

const pos = new THREE.Vector2(0, 0);       // puck position on the plane (x, z)
const vel = new THREE.Vector2(0, 0);

// ---------------------------------------------------------------- aim guide
const aim = new THREE.Group();
aim.visible = false;
scene.add(aim);

const aimBar = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 0.16),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75 })
);
aimBar.rotation.x = -Math.PI / 2;
aim.add(aimBar);

const aimHead = new THREE.Mesh(
  new THREE.ConeGeometry(0.34, 0.72, 3),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
);
aimHead.rotation.x = -Math.PI / 2;
aim.add(aimHead);

function showAim(dirX, dirZ, power) {
  if (power <= 0.02) { aim.visible = false; return; }
  const len = 1.4 + power * 5.4;
  const angle = Math.atan2(dirX, dirZ);

  // Both meshes are laid flat by rotation.x, so the in-plane spin lands on z.
  aimBar.scale.set(len, 1, 1);
  aimBar.position.set(pos.x + dirX * len / 2, 0.05, pos.y + dirZ * len / 2);
  aimBar.rotation.z = angle - Math.PI / 2;

  aimHead.position.set(pos.x + dirX * (len + 0.3), 0.05, pos.y + dirZ * (len + 0.3));
  aimHead.rotation.z = angle + Math.PI;

  const hot = new THREE.Color().setHSL(0.36 - power * 0.36, 0.65, 0.62);
  aimBar.material.color.copy(hot);
  aimHead.material.color.copy(hot);
  aim.visible = true;
}

// ---------------------------------------------------------------- game state
const state = {
  mode: 'ai',
  difficulty: 'normal',
  target: 7,
  score: [0, 0],       // index 0 = player 1 (near, +z end), 1 = player 2 (far)
  turn: 0,
  phase: 'aim',        // aim | moving | over
  aiTimer: 0,
};

const isAiTurn = () => state.mode === 'ai' && state.turn === 1;

function resetPuck(towards) {
  pos.set(0, towards * (halfL * 0.32));
  vel.set(0, 0);
}

function newGame() {
  state.score = [0, 0];
  state.turn = 0;
  state.phase = 'aim';
  resetPuck(1);
  banner.hidden = true;
  updateScore();
  scheduleAi();
}

function scoreGoal(concededBy) {
  const scorer = concededBy === 0 ? 1 : 0;
  state.score[scorer]++;
  updateScore();
  goalSound();
  vibrate([20, 60, 30]);

  if (state.score[scorer] >= state.target) {
    state.phase = 'over';
    aim.visible = false;
    bannerTitle.textContent = (scorer === 0 ? 'Player 1' : state.mode === 'ai' ? 'Computer' : 'Player 2') + ' wins';
    bannerText.textContent = state.score[0] + ' – ' + state.score[1];
    banner.hidden = false;
    return;
  }

  // The player who conceded shoots next, from their own half.
  state.turn = concededBy;
  resetPuck(concededBy === 0 ? 1 : -1);
  state.phase = 'aim';
  scheduleAi();
}

function fire(dirX, dirZ, power) {
  const speed = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * power;
  vel.set(dirX * speed, dirZ * speed);
  state.phase = 'moving';
  aim.visible = false;
  hitSound(0.5 + power * 0.5, 320);
  vibrate(14);
}

function endTurn() {
  state.phase = 'aim';
  state.turn = state.turn === 0 ? 1 : 0;
  updateScore();
  scheduleAi();
}

// ---------------------------------------------------------------- physics
function stepPuck(dt) {
  const speed = vel.length();
  if (speed < STOP_SPEED) {
    vel.set(0, 0);
    return true;                            // came to rest
  }

  // Substep so a fast puck cannot tunnel through a rail in one frame.
  const steps = Math.min(6, Math.ceil((speed * dt) / (PUCK_R * 0.8)) || 1);
  const h = dt / steps;

  for (let s = 0; s < steps; s++) {
    pos.x += vel.x * h;
    pos.y += vel.y * h;

    const limX = halfW - PUCK_R;
    if (pos.x < -limX) { pos.x = -limX; vel.x = Math.abs(vel.x) * REST; railSound(); }
    else if (pos.x > limX) { pos.x = limX; vel.x = -Math.abs(vel.x) * REST; railSound(); }

    const limZ = halfL - PUCK_R;
    const inMouth = Math.abs(pos.x) < goalHalf - PUCK_R * 0.3;

    if (pos.y < -limZ) {
      if (inMouth) {
        if (pos.y < -(halfL + 0.9)) { scoreGoal(1); return false; }
      } else { pos.y = -limZ; vel.y = Math.abs(vel.y) * REST; railSound(); }
    } else if (pos.y > limZ) {
      if (inMouth) {
        if (pos.y > halfL + 0.9) { scoreGoal(0); return false; }
      } else { pos.y = limZ; vel.y = -Math.abs(vel.y) * REST; railSound(); }
    }
  }

  const decay = Math.exp(-DRAG_K * dt);
  vel.multiplyScalar(decay);
  return false;
}

// ---------------------------------------------------------------- ai
function scheduleAi() {
  state.aiTimer = isAiTurn() ? 0.75 : 0;
}

function aiShoot() {
  // Aim at the near goal (player 1 concedes at +z), with error by difficulty.
  const goalX = clamp(pos.x * 0.35, -goalHalf * 0.55, goalHalf * 0.55);
  const dx = goalX - pos.x;
  const dz = (halfL + 1.2) - pos.y;
  let angle = Math.atan2(dx, dz);
  angle += (Math.random() * 2 - 1) * AI_ERROR[state.difficulty];

  const [lo, hi] = AI_POWER[state.difficulty];
  const dist = Math.hypot(dx, dz) / (halfL * 2);
  const power = clamp(lo + (hi - lo) * (0.45 + dist * 0.75) * (0.85 + Math.random() * 0.3), 0.2, 1);

  fire(Math.sin(angle), Math.cos(angle), power);
}

// ---------------------------------------------------------------- input
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const pointerNdc = new THREE.Vector2();
const hitPoint = new THREE.Vector3();

let dragging = false;
let dragDir = { x: 0, z: 1 }, dragPower = 0;

function pointerToTable(e) {
  pointerNdc.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNdc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerNdc, camera);
  return raycaster.ray.intersectPlane(groundPlane, hitPoint) ? hitPoint : null;
}

function updateDrag(e) {
  const p = pointerToTable(e);
  if (!p) return;
  // Slingshot: pull away from the puck, it fires the opposite way.
  const pullX = pos.x - p.x, pullZ = pos.y - p.z;
  const pull = Math.hypot(pullX, pullZ);
  dragPower = clamp(pull / MAX_PULL, 0, 1);
  if (pull > 0.001) { dragDir = { x: pullX / pull, z: pullZ / pull }; }
  showAim(dragDir.x, dragDir.z, dragPower);
}

function onPointerDown(e) {
  if (state.phase !== 'aim' || isAiTurn()) return;
  dragging = true;
  renderer.domElement.setPointerCapture?.(e.pointerId);
  updateDrag(e);
}

function onPointerMove(e) {
  if (dragging) updateDrag(e);
}

function onPointerUp() {
  if (!dragging) return;
  dragging = false;
  if (dragPower > 0.06) fire(dragDir.x, dragDir.z, dragPower);
  else aim.visible = false;
  dragPower = 0;
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);
renderer.domElement.addEventListener('pointercancel', onPointerUp);
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------------------------------------------------------------- sound
let audio = null, noise = null, lastRail = 0;

function initAudio() {
  if (audio) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audio = new Ctx();
  const len = Math.floor(audio.sampleRate * 0.25);
  noise = audio.createBuffer(1, len, audio.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
}

function hitSound(strength, freq) {
  if (!audio || audio.state !== 'running') return;
  const src = audio.createBufferSource();
  src.buffer = noise;
  const band = audio.createBiquadFilter();
  band.type = 'bandpass';
  band.frequency.value = freq;
  band.Q.value = 2.2;
  const gain = audio.createGain();
  const t = audio.currentTime;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.3 * strength + 0.01, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  src.connect(band).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + 0.14);
}

function railSound() {
  const now = performance.now();
  if (now - lastRail < 60) return;
  lastRail = now;
  hitSound(clamp(vel.length() / MAX_SPEED, 0.15, 1), 900 + Math.random() * 700);
}

function goalSound() {
  if (!audio || audio.state !== 'running') return;
  const t = audio.currentTime;
  [523.25, 659.25, 783.99].forEach((f, i) => {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'triangle';
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.0001, t + i * 0.07);
    gain.gain.exponentialRampToValueAtTime(0.16, t + i * 0.07 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.07 + 0.26);
    osc.connect(gain).connect(audio.destination);
    osc.start(t + i * 0.07);
    osc.stop(t + i * 0.07 + 0.3);
  });
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ---------------------------------------------------------------- layout
function layout() {
  const aspect = window.innerWidth / window.innerHeight;
  // Keep the table between 1.25:1 and 2:1 so it stays a hockey table in both
  // orientations, then let the camera frame whatever shape that produced.
  const ratio = clamp(1 / aspect * 1.15, 1.25, 2.0);
  halfW = 5;
  halfL = halfW * ratio;
  goalHalf = halfW * 0.42;

  buildTable();

  const halfV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const needW = (halfW + RAIL_T) * 1.1;
  const needL = (halfL + RAIL_T) * 1.14;
  const dist = Math.max(needW / (halfV * aspect), needL / halfV);

  const tilt = 0.26;                        // radians off straight down
  camera.position.set(0, Math.cos(tilt) * dist, Math.sin(tilt) * dist);
  camera.lookAt(0, 0, 0);

  const bg = new THREE.Color(theme.bg);
  scene.background = bg;
  document.body.style.background = '#' + bg.getHexString();
}

function applyTheme(name) {
  theme = THEMES[name] || THEMES.ice;
  feltMat.color.set(theme.felt);
  railMat.color.set(theme.rail);
  lineMat.color.set(theme.line);
  const bg = new THREE.Color(theme.bg);
  scene.background = bg;
  document.body.style.background = '#' + bg.getHexString();
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (state.phase === 'moving') {
    if (stepPuck(dt)) endTurn();
  } else if (state.phase === 'aim' && isAiTurn()) {
    state.aiTimer -= dt;
    const charge = clamp(1 - state.aiTimer / 0.75, 0, 1);
    const goalX = clamp(pos.x * 0.35, -goalHalf * 0.55, goalHalf * 0.55);
    const angle = Math.atan2(goalX - pos.x, (halfL + 1.2) - pos.y);
    showAim(Math.sin(angle), Math.cos(angle), charge * 0.6);
    if (state.aiTimer <= 0) aiShoot();
  }

  puck.position.set(pos.x, PUCK_H / 2, pos.y);
  puckTop.position.set(pos.x, PUCK_H + 0.002, pos.y);

  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- ui
const gear = document.getElementById('gear');
const panel = document.getElementById('panel');
const modeSel = document.getElementById('mode');
const diffSel = document.getElementById('difficulty');
const targetSel = document.getElementById('target');
const themeSel = document.getElementById('tableStyle');
const restartBtn = document.getElementById('restart');
const topScore = document.getElementById('topScore');
const bottomScore = document.getElementById('bottomScore');
const banner = document.getElementById('banner');
const bannerTitle = document.getElementById('bannerTitle');
const bannerText = document.getElementById('bannerText');
const bannerButton = document.getElementById('bannerButton');
const hint = document.getElementById('hint');

function updateScore() {
  topScore.querySelector('.name').textContent = state.mode === 'ai' ? 'Computer' : 'Player 2';
  topScore.querySelector('.pts').textContent = state.score[1];
  bottomScore.querySelector('.pts').textContent = state.score[0];
  topScore.classList.toggle('active', state.turn === 1);
  bottomScore.classList.toggle('active', state.turn === 0);
  hint.textContent = state.phase === 'over' ? ''
    : isAiTurn() ? 'Computer is lining up…'
    : (state.mode === 'local' ? 'Player ' + (state.turn + 1) + ': ' : '') + 'pull back from the puck, release to fire';
}

function setPanelOpen(open) {
  panel.hidden = !open;
  gear.setAttribute('aria-expanded', String(open));
}

gear.addEventListener('click', () => setPanelOpen(panel.hidden));
restartBtn.addEventListener('click', () => { newGame(); setPanelOpen(false); });
bannerButton.addEventListener('click', newGame);

modeSel.addEventListener('change', () => { state.mode = modeSel.value; newGame(); });
diffSel.addEventListener('change', () => { state.difficulty = diffSel.value; });
targetSel.addEventListener('change', () => { state.target = parseInt(targetSel.value, 10); newGame(); });
themeSel.addEventListener('change', () => applyTheme(themeSel.value));

window.addEventListener('pointerdown', initAudio, { once: true });
window.addEventListener('pointerdown', () => {
  if (audio && audio.state === 'suspended') audio.resume();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  layout();
});

state.mode = modeSel.value;
state.difficulty = diffSel.value;
state.target = parseInt(targetSel.value, 10);
setPanelOpen(false);
applyTheme(themeSel.value);
layout();
newGame();
animate();
</script>
